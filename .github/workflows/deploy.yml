# Builds the Angular app and publishes it to GitHub Pages on every push to main.
# One-time setup: repo Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The site is served from https://<user>.github.io/<repo>/, so the app needs that base path.
      - name: Build
        run: npx ng build --base-href "/${{ github.event.repository.name }}/"

      # Pages has no SPA rewrites: serve index.html for unknown paths so deep links work,
      # and disable Jekyll so files are served as-is.
      - name: Add SPA fallback
        run: |
          cp dist/logistics-prototype/browser/index.html dist/logistics-prototype/browser/404.html
          touch dist/logistics-prototype/browser/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/logistics-prototype/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
